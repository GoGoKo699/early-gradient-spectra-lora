[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "strank"
version = "0.1.0"
description = "Synthetic transformer rank-allocation experiments"
requires-python = ">=3.10"
dependencies = [
  "numpy",
  "pandas",
  "matplotlib",
  "pyyaml",
  "torch",
]

[tool.setuptools.packages.find]
include = ["strank*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
