run:
  name: publication_associative_recall_template
  seed: 101
  out_dir: runs/transformer_source_runs
  device: cpu
  torch_threads: 12

task:
  name: associative_recall
  num_keys: 16
  num_pairs: 4
  base_shift: 0
  adapt_shift: 3
  train_batch_size: 128
  eval_batches: 8

model:
  d_model: 64
  n_layers: 2
  n_heads: 4
  d_mlp: 128
  dropout: 0.0

base_train:
  steps: 1000
  lr: 0.002
  weight_decay: 0.0
  log_every: 100

calibration:
  batches: 8
  batch_size: 128
  whitening: diag
  lambda_scale: 0.01
  null_bootstrap: 4096
  null_quantile: 0.995
  null_uncertainty_resamples: 2000
  null_uncertainty_confidence: 0.95
  max_tokens_per_site: 8192

sites:
  include:
    - blocks.0.attn.q_proj
    - blocks.0.attn.k_proj
    - blocks.0.attn.v_proj
    - blocks.0.attn.o_proj
    - blocks.0.mlp.fc2
    - blocks.1.attn.q_proj
    - blocks.1.attn.k_proj
    - blocks.1.attn.v_proj
    - blocks.1.attn.o_proj
    - blocks.1.mlp.fc2

lora:
  ranks: [0, 1, 2, 4, 8, 16]
  alpha: 16.0
  scaling_modes: [fixed_update_scale, standard, rslora]
  scale_reference_rank: 4
  lr: 0.01
  steps: 350
  weight_decay: 0.0
  log_every: 100
  grad_clip: 1.0

budgets:
  param_budgets: [512, 1024, 1536, 2048, 3072, 4096, 6144]
  rules:
    - uniform
    - uniform_fill
    - effective_rank
    - soft_dimension
    - gradient_norm
    - marginal_gain_edge
    - marginal_gain_soft
  cost_matched_rules:
    - effective_rank
    - soft_dimension
    - gradient_norm
    - marginal_gain_edge
    - marginal_gain_soft

targets:
  near_best_gaps: [0.1, 0.2]
  recovery_fracs: [0.7, 0.8]
  penalty_lambdas: [0.2, 0.3]

protocol:
  adaptation_replicates: 3
  sweep_replicates: 1
  primary_scaling_mode: fixed_update_scale
  primary_allocation_rule: soft_dimension
  primary_reference_rule: uniform_exact_cost
  primary_metric: final_val_loss
  independent_unit: task_seed_run
  exact_modular_evaluation: false
