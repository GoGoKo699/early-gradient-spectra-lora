seed: 13
output:
  base_dir: runs
  name: alpha_sweep
task:
  d_in: 128
  d_out: 128
  n_train: 2048
  n_val: 1024
  task_rank: 8
  task_spikes: [2.8, 2.2, 1.8, 1.45, 1.1, 0.85, 0.65, 0.5]
  label_noise_std: 0.08
  base_scale: 0.2
  activation_spectrum: powerlaw
  activation_decay: 0.7
train:
  lr: 0.4
  steps: 500
  weight_decay: 0.0000
  init_scale: 0.1
  eval_every: 25
  batch_size: 512
  grad_clip: 50.0
sweep:
  task_repetitions: 2
  rank: 16
  alphas: [1, 2, 4, 8, 16, 32, 64, 128]
detect:
  gradient_matrix_mode: activation_whitened
  gradient_ridge_scale: 1.0e-06
  include_raw_gradient: true
  null_method: permute
  n_boot: 20
  quantile: 0.995
  intruder_overlap_threshold: 0.05
