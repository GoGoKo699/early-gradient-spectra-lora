name: Compact evidence checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  compact:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify checksums and compact statistics
        run: python verify.py
      - name: Exercise verifier failure cases
        run: python -m unittest discover -s tests -v
